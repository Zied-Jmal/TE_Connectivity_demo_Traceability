version: "3.7"
services:
  app:
    container_name: te_connectivity_backend
    build:
      context: ./te-connectivity-backend
      dockerfile: Dockerfile
    volumes:
      - ./te-connectivity-backend:/var/www/html
    ports:
      - "8000:8000"
    networks:
      - app-network
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/traceability_db

  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: traceability_db
    ports:
      - "3306:3306"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./te-connectivity-backend:/var/www/html
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql  # MySQL container name
      PMA_USER: root   # MySQL root user
      PMA_PASSWORD: root  # MySQL root password
    ports:
      - "8081:80"  # phpMyAdmin will be accessible on port 8081
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
